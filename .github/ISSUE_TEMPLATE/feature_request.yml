name: Proposer une fonctionnalité
description: Suggérer une amélioration ou une nouvelle fonctionnalité
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Merci de contribuer à l’amélioration de ce projet.

        Recherchez d’abord les issues existantes. Une proposition de fonctionnalité
        doit mettre l’accent sur le problème et sa valeur, sans imposer une seule solution.
  - type: textarea
    id: problem
    attributes:
      label: Problème
      description: Quel problème cette modification résoudrait-elle et qui est concerné ?
      placeholder: "En tant que ..., j’ai besoin de ..., parce que ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
      description: Décrivez le comportement ou le résultat que vous aimeriez obtenir.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Solutions alternatives envisagées
      description: Quels contournements ou quelles autres approches avez-vous essayés ?
  - type: textarea
    id: context
    attributes:
      label: Contexte complémentaire
      description: Ajoutez des exemples, captures d’écran, liens ou notes d’implémentation.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: Je serais prêt(e) à contribuer à cette modification.
