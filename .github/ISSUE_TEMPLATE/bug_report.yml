name: Signaler un bug
description: Signaler un problème reproductible
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug.

        Recherchez d’abord les issues existantes et supprimez toute information sensible
        des logs, captures d’écran et exemples avant d’envoyer votre signalement.
  - type: textarea
    id: summary
    attributes:
      label: Résumé
      description: Décrivez le problème en quelques phrases claires.
      placeholder: "Décrivez clairement et brièvement ce qui ne fonctionne pas."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire le problème
      description: Indiquez les étapes minimales qui permettent de reproduire le problème de manière fiable.
      placeholder: |
        1. Configurer ...
        2. Exécuter ...
        3. Observer ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Quel résultat attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      description: Que s’est-il passé à la place ? Ajoutez le message d’erreur complet si nécessaire.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
      description: Quelle version, quel commit ou quelle version du package est concerné ?
      placeholder: "v1.2.3 ou abc1234"
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Indiquez le système d’exploitation, l’environnement d’exécution, le navigateur et tout autre détail utile.
      placeholder: "Système, version de l’environnement, cible de déploiement et configuration pertinente"
  - type: textarea
    id: logs
    attributes:
      label: Logs et contexte complémentaire
      description: Ajoutez les logs, captures d’écran, liens ou une reproduction minimale pertinents. Masquez d’abord les secrets.
      render: shell
