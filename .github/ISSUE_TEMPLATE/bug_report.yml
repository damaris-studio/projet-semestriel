name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please search existing issues first and remove any sensitive information
        from logs, screenshots, and examples before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in a few clear sentences.
      placeholder: "A clear and concise description of what went wrong."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reliably reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the complete error message when relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, commit, or package version is affected?
      placeholder: "v1.2.3 or abc1234"
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, runtime, browser, or other relevant details.
      placeholder: "OS, runtime version, deployment target, and relevant configuration"
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Add relevant logs, screenshots, links, or a minimal reproduction. Redact secrets first.
      render: shell
