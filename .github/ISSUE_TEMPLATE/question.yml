name: Question ou discussion
description: Poser une question ou lancer une discussion ciblée
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Consultez la documentation et les discussions existantes avant d’ouvrir une nouvelle question.
        Pour les sujets sensibles, utilisez le canal de contact privé indiqué dans le projet.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Que souhaitez-vous comprendre ou discuter ?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Partagez la configuration concernée, les solutions essayées et les liens utiles.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Informations complémentaires
      description: Ajoutez tout élément susceptible d’aider les autres à répondre.
